 <label class="user-active"><input type="checkbox" name="active" ${user?.active!==false?'checked':''}> Usuario habilitado</label>
 <div class="modal-footer"><button type="button" class="btn" id="closeUser">Cancelar</button><button type="submit" class="btn primary">Guardar usuario</button></div></form>`);
 $('#closeUser').addEventListener('click',closeModal);
 $('#userForm').addEventListener('submit',ev=>{
  ev.preventDefault();const f=new FormData(ev.currentTarget);const email=normalizedEmail(f.get('email'));const name=String(f.get('name')||'').trim();const role=String(f.get('role'));const active=f.get('active')==='on';
  if(!name||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)||!['admin_bi','jefe','solicitante'].includes(role)){notify('Revisa el nombre, correo y rol');return}
  if(!editing&&state.users.some(x=>normalizedEmail(x.email)===email)){notify('Ese correo ya está registrado');return}
  if(editing&&user.key===currentUser.key&&(role!=='admin_bi'||!active)){notify('No puedes deshabilitar tu propia cuenta de administrador');return}
  const record=editing?user:{key:'usr'+Math.random().toString(36).slice(2,10),email};
  Object.assign(record,{email,name,role,active,initial:name.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase(),subtitle:role==='admin_bi'?'Administrador BI':role==='jefe'?'Jefatura / Dirección':'Solicitante'});
  if(!editing)state.users.push(record);
  USERS=state.users;state.history.push({item:email,actor:currentUser.name,action:editing?'Usuario modificado':'Usuario registrado',to:role});save();closeModal();userAdmin();notify(editing?'Permisos actualizados':'Usuario registrado en el entorno demo');
 });
}
function myProjects(){
 if(allowed()){route='projects';render();return}
 const email=normalizedEmail(currentUser.email);
 const ownRequests=state.requests.filter(r=>normalizedEmail(r.email)===email);
 const ownProjects=state.projects.filter(p=>ownRequests.some(r=>r.projectId===p.id));
 const content=pageHead('MI ESPACIO','Seguimiento de mis proyectos','Consulta el estado y los compromisos vinculados a tus solicitudes.',`<button class="btn primary" data-nav="new">＋ Nueva solicitud</button>`)+
 `<div class="metrics">${metric('Solicitudes enviadas',ownRequests.length,'Presentadas por tu usuario','▧')}${metric('Proyectos asignados',ownProjects.length,'Vinculados a tus solicitudes','▤')}${metric('En proceso',ownProjects.filter(p=>!finalStatuses.includes(p.status)).length,'Proyectos activos','↗')}${metric('Terminados',ownProjects.filter(p=>finalStatuses.includes(p.status)).length,'Publicados o cerrados','✓')}</div>`+
 `<div class="card"><div class="card-head"><h2>Mis proyectos</h2></div>${ownProjects.length?`<div class="table-wrap"><table><thead><tr><th>Proyecto</th><th>Estado</th><th>Avance</th><th>Entrega estimada</th><th>Próximo hito</th></tr></thead><tbody>${ownProjects.map(p=>`<tr><td><strong>${e(p.name)}</strong></td><td>${showStatus(p.status)}</td><td>${progress(p.progress)}</td><td>${e(p.dueDate||'—')}</td><td>${e(p.nextMilestone||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Tus solicitudes todavía no tienen proyectos vinculados. Puedes consultar sus folios en Mis solicitudes.</div>'}</div>`;
 shell(content);
}

function wireCommon(){document.querySelectorAll('[data-project]').forEach(el=>el.addEventListener('click',()=>{selectedProject=el.dataset.project;route='detail';render()}));document.querySelectorAll('[data-request]').forEach(el=>el.addEventListener('click',()=>{selectedProject=el.dataset.request;route='request-detail';render()}));document.querySelectorAll('[data-action="export"]').forEach(el=>el.addEventListener('click',()=>{const rows=[['Proyecto','Área','Estado','Prioridad','Avance','Fecha compromiso'],...state.projects.map(p=>[p.name,p.area,p.status,p.priority,p.progress,p.dueDate])];const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Jirajorge_demo_portafolio.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);notify('Resumen de demostración exportado') }));}
function render(){if(!currentUser){loginScreen();return}if(!allowed()&&!['requests','new','request-detail','my-projects'].includes(route)){route=homeFor(currentUser)}if(route==='dashboard')dashboard();else if(route==='projects')projects();else if(route==='detail')detail(selectedProject);else if(route==='requests')requests();else if(route==='request-detail')requestDetail(selectedProject);else if(route==='approvals')approvals();else if(route==='activities'&&admin())activities();else if(route==='users'&&admin())userAdmin();else if(route==='my-projects')myProjects();else if(route==='new')newRequest();else dashboard()}
window.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&dialog)closeModal()});render();
</script></body></html>
