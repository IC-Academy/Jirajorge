function dashboard(){const ps=state.projects,rs=state.requests;const active=ps.filter(p=>!finalStatuses.includes(p.status)),blocked=ps.filter(p=>p.status==='Bloqueado'||p.blocker),overdue=active.filter(p=>p.dueDate<dateISO()),mean=Math.round(ps.reduce((s,p)=>s+p.progress,0)/Math.max(1,ps.length));const countByStatus={};ps.forEach(p=>countByStatus[p.status]=(countByStatus[p.status]||0)+1);const pending=state.approvals.filter(a=>a.decision==='Pendiente').length;const content=pageHead('Dashboard · Dirección','Visión general del portafolio','15 proyectos y 75 actividades importados del Excel. Avance calculado por entregables finalizados; datos de corte del archivo.',`<button class="btn" data-action="export">↧ Exportar resumen</button><button class="btn primary" data-nav="projects">Ver portafolio →</button>`)+`<div class="metrics">${metric('Proyectos en cartera',ps.length,'<i>'+active.length+' proyectos activos</i>','▤')}${metric('Avance promedio',mean+'%','Avance estimado: tareas Finalizado / total','◉')}${metric('Entregas vencidas',overdue.length,'Compromisos que requieren atención','◷')}${metric('Por autorizar',pending,'Decisiones individuales pendientes','◈')}</div><div class="grid"><div class="card"><div class="card-head"><div><h2>Proyectos prioritarios</h2><p>Ordenados por criticidad y fecha compromiso</p></div><button class="section-link" data-nav="projects">Ver todos →</button></div><div class="table-wrap"><table><thead><tr><th>Proyecto</th><th>Estado</th><th>Avance</th><th>Entrega</th></tr></thead><tbody>${[...ps].sort((a,b)=>({Crítica:0,Alta:1,Media:2,Baja:3}[a.priority]??9)-({Crítica:0,Alta:1,Media:2,Baja:3}[b.priority]??9)).slice(0,6).map(p=>`<tr class="clickrow" data-project="${e(p.id)}"><td><strong>${e(p.name)}</strong><br><span class="muted" style="font-size:10px">${e(p.area)}</span></td><td>${showStatus(p.status)}</td><td>${progress(p.progress)}</td><td>${e(p.dueDate)}</td></tr>`).join('')}</tbody></table></div></div><div style="display:flex;flex-direction:column;gap:18px"><div class="card"><div class="card-head"><div><h2>Distribución del portafolio</h2><p>Proyectos por situación actual</p></div></div><div class="card-body">${Object.entries(countByStatus).map(([s,n])=>`<div class="chart-row"><div class="chart-label">${e(s)}</div><div class="chart-track"><div class="chart-fill" style="width:${Math.round(100*n/ps.length)}%"></div></div><div class="chart-count">${n}</div></div>`).join('')}</div></div><div class="alert">⚠ <span><strong>${blocked.length} proyectos con alertas.</strong><br>Revisa dependencias, bloqueos y fechas para la siguiente reunión ejecutiva.</span></div></div></div><div class="card" style="margin-top:19px"><div class="card-head"><div><h2>Solicitudes recientes</h2><p>Requerimientos pendientes de revisión y autorización</p></div><button class="section-link" data-nav="requests">Abrir solicitudes →</button></div><div class="table-wrap"><table><thead><tr><th>Folio</th><th>Proyecto solicitado</th><th>Área</th><th>Prioridad</th><th>Estado</th></tr></thead><tbody>${rs.slice(-5).reverse().map(r=>`<tr class="clickrow" data-request="${e(r.id)}"><td>${e(r.id)}</td><td><strong>${e(r.title)}</strong></td><td>${e(r.area)}</td><td>${priority(r.priority)}</td><td>${showStatus(r.status)}</td></tr>`).join('')}</tbody></table></div></div>`;shell(content);wireCommon()}
function projects(){const ps=state.projects.filter(p=>[p.name,p.id,p.area,p.status,p.priority].some(v=>v.toLowerCase().includes(filter.toLowerCase())));const tabs=`<div class="tabs">${[['lista','Lista'],['kanban','Kanban'],['gantt','Gantt']].map(([v,l])=>`<button class="tab ${view===v?'active':''}" data-view="${v}">${l}</button>`).join('')}</div>`;let body='';if(view==='lista')body=`<div class="table-wrap"><table><thead><tr><th>Proyecto</th><th>Estado</th><th>Prioridad</th><th>Avance</th><th>Fecha compromiso</th><th></th></tr></thead><tbody>${ps.map(p=>`<tr class="clickrow" data-project="${e(p.id)}"><td><strong>${e(p.name)}</strong><br><small>${e(p.id)} · ${e(p.area)}</small></td><td>${showStatus(p.status)}</td><td>${priority(p.priority)}</td><td>${progress(p.progress)}</td><td>${e(p.dueDate)}</td><td style="color:#3c69d8">Ver →</td></tr>`).join('')}</tbody></table></div>`;if(view==='kanban'){const groups=[['Backlog',p=>p.status==='Backlog'||p.status==='Programado'],['En ejecución',p=>['En análisis','En desarrollo'].includes(p.status)],['Validación',p=>p.status==='En pruebas'||p.status==='Bloqueado'],['Finalizados',p=>finalStatuses.includes(p.status)]];body=`<div class="board">${groups.map(([title,fn])=>{const group=ps.filter(fn);return `<div class="column"><div class="column-title"><span>${title}</span><span>${group.length}</span></div>${group.map(p=>`<button class="kanban-card" data-project="${e(p.id)}"><small>${e(p.id)} · ${e(p.area)}</small><strong>${e(p.name)}</strong><div class="kanban-foot">${priority(p.priority)}<span style="font-size:11px;color:#56769c">${p.progress}%</span></div><div class="track" style="margin-top:13px;width:100%"><div class="fill" style="width:${p.progress}%"></div></div></button>`).join('')}</div>`}).join('')}</div>`}if(view==='gantt'){const dates=ps.flatMap(p=>[Date.parse(p.startDate),Date.parse(p.dueDate)]);const mn=Math.min(...dates),mx=Math.max(...dates),span=Math.max(86400000,mx-mn+86400000);const pos=d=>Math.max(0,100*(Date.parse(d)-mn)/span);body=`<div class="table-wrap"><div class="gantt"><div class="gantt-axis">${[0,.25,.5,.75,1].map(k=>new Date(mn+span*k).toISOString().slice(0,10)).map(d=>`<span>${d}</span>`).join('')}</div>${ps.map(p=>`<div class="gantt-row"><div class="gantt-name">${e(p.name)}<small>${e(p.status)} · ${p.progress}%</small></div><button class="time-track" data-project="${e(p.id)}" aria-label="Abrir ${e(p.name)}" style="border:0;cursor:pointer"><span class="time-bar" style="left:${pos(p.startDate)}%;width:${Math.max(1,pos(p.dueDate)-pos(p.startDate))}%"><span class="time-done" style="display:block;width:${p.progress}%"></span></span></button></div>`).join('')}</div></div>`}const content=pageHead('Portafolio','Cartera de proyectos','Control integral de entregables, prioridades, responsables y avances.',admin()?`<button class="btn primary" id="newProject">＋ Nuevo proyecto</button>`:'')+`<div class="card"><div class="card-head"><div><h2>Proyectos registrados</h2><p>${ps.length} coincidencias · Clic en un proyecto para abrir su expediente</p></div></div><div class="card-body"><div class="toolbar"><input class="input search" id="projectSearch" aria-label="Buscar proyectos" placeholder="Buscar proyecto, área, estado o folio" value="${e(filter)}">${tabs}</div></div>${body||'<div class="empty">No hay proyectos para esta búsqueda.</div>'}</div>`;shell(content);wireCommon();$('#projectSearch')?.addEventListener('input',ev=>{filter=ev.target.value;const caret=ev.target.selectionStart;projects();const n=$('#projectSearch');n?.focus();n?.setSelectionRange(caret,caret)});document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;projects()}));$('#newProject')?.addEventListener('click',()=>openProjectForm())}
function detail(id){const p=state.projects.find(x=>x.id===id);if(!p){route='projects';render();return}const tasks=state.activities.filter(a=>a.projectId===id);const content=`<button class="detail-back" id="backProjects">← Volver a cartera</button>`+pageHead('Expediente del proyecto',e(p.name),`${e(p.id)} · ${e(p.area)}`,admin()?`<button class="btn primary" id="editProject">Editar proyecto</button>`:'')+`<div class="metrics">${metric('Avance reportado',p.progress+'%','Estimado por actividades finalizadas','◉')}${metric('Actividades',tasks.length,'Tareas registradas','☑')}${metric('Fecha compromiso',e(p.dueDate),'Entrega planificada','▦')}${metric('Prioridad',e(p.priority),'Clasificación vigente','⚑')}</div><div class="detail-grid"><div class="card"><div class="card-head"><h2>Plan de trabajo y actividades</h2>${admin()?'<button class="section-link" id="newTask">＋ Agregar actividad</button>':''}</div><div class="card-body">${tasks.length?tasks.map(a=>`<div class="task"><div><h4>${e(a.name)}</h4><small>${e(a.phase)} · ${e(a.dueDate)} · ${e(a.owner)}</small>${a.impact?`<p class="task-impact" style="margin:7px 0 0;font-size:12px;color:#718096">${e(a.impact)}</p>`:''}<div style="margin-top:8px">${showStatus(a.status)}</div></div><div class="task-actions">${progress(a.progress)}${admin()?`<button class="btn" data-edit-task="${e(a.id)}">Editar</button>`:''}</div></div>`).join(''):'<div class="empty">Sin actividades. Agrega tareas para dar seguimiento.</div>'}</div></div><div><div class="card"><div class="card-head"><h2>Datos del proyecto</h2></div><div class="card-body"><div class="detail-line"><label>Responsable</label><strong>${e(p.owner)}</strong></div><div class="detail-line"><label>Patrocinador</label><strong>${e(p.sponsor)}</strong></div><div class="detail-line"><label>Situación</label>${showStatus(p.status)}</div><div class="detail-line"><label>Salud</label><strong>${e(p.health)}</strong></div><div class="detail-line"><label>Próximo hito</label><strong>${e(p.nextMilestone)}</strong></div><div class="detail-line"><label>Fecha del hito</label><strong>${e(p.milestoneDate)}</strong></div><div class="detail-line"><label>Bloqueo actual</label><span style="font-size:12px">${e(p.blocker)||'Sin bloqueos registrados'}</span></div></div></div></div></div>`;shell(content);wireCommon();$('#backProjects')?.addEventListener('click',()=>{selectedProject=null;route='projects';render()});$('#editProject')?.addEventListener('click',()=>openProjectForm(p));$('#newTask')?.addEventListener('click',()=>openTaskForm(id));document.querySelectorAll('[data-edit-task]').forEach(b=>b.addEventListener('click',()=>openTaskForm(id,state.activities.find(x=>x.id===b.dataset.editTask))))}
function requests(){const rs=state.requests.filter(r=>allowed()||normalizedEmail(r.email)===normalizedEmail(currentUser.email));const content=pageHead('Solicitudes',currentUser.role==='solicitante'?'Mis solicitudes':'Bandeja de solicitudes','Registro, evaluación y seguimiento de requerimientos.',`<button class="btn primary" data-nav="new">＋ Nueva solicitud</button>`)+`<div class="metrics">${metric('Solicitudes',rs.length,'Registradas en esta sesión demo','▧')}${metric('Nuevas',rs.filter(x=>x.status==='Nueva').length,'Por clasificar','◌')}${metric('En evaluación',rs.filter(x=>/evaluación/i.test(x.status)).length,'Pendientes de revisión','◎')}${metric('Autorización',rs.filter(x=>/autorizaci[oó]n/i.test(x.status)).length,'En revisión directiva','◈')}</div><div class="card"><div class="card-head"><div><h2>Solicitudes registradas</h2><p>Selecciona un folio para consultar detalles</p></div></div><div class="table-wrap"><table><thead><tr><th>Folio</th><th>Solicitud</th><th>Área</th><th>Solicitante</th><th>Prioridad</th><th>Estado</th></tr></thead><tbody>${rs.map(r=>`<tr class="clickrow" data-request="${e(r.id)}"><td>${e(r.id)}</td><td><strong>${e(r.title)}</strong></td><td>${e(r.area)}</td><td>${e(r.owner)}</td><td>${priority(r.priority)}</td><td>${showStatus(r.status)}</td></tr>`).join('')}</tbody></table></div></div>`;shell(content);wireCommon()}
function requestDetail(id){const r=state.requests.find(r=>r.id===id);if(!r||(!allowed()&&normalizedEmail(r.email)!==normalizedEmail(currentUser.email))){route='requests';render();return}const apps=state.approvals.filter(a=>a.requestId===id);const content=`<button class="detail-back" id="backRequests">← Volver a solicitudes</button>`+pageHead('Solicitud de proyecto',e(r.title),`${e(r.id)} · Creada ${e(r.date)}`,admin()?`<button class="btn primary" id="evaluateRequest">Actualizar evaluación</button>`:'')+`<div class="grid"><div class="card"><div class="card-head"><h2>Descripción del requerimiento</h2></div><div class="card-body"><div class="detail-line"><label>Problema o necesidad</label><strong>${e(r.description)}</strong></div><div class="detail-line"><label>Beneficio esperado</label><strong>${e(r.benefit)}</strong></div><div class="detail-line"><label>Estado actual</label>${showStatus(r.status)}</div><div class="detail-line"><label>Área</label><strong>${e(r.area)}</strong></div></div></div><div class="card"><div class="card-head"><h2>Aprobaciones individuales</h2></div><div class="card-body">${apps.length?apps.map(a=>`<div class="task"><div><h4>${e(USERS.find(u=>u.key===a.approver)?.name||a.approver)}</h4><small>${e(a.comment||'Sin comentarios')}</small></div>${showStatus(a.decision)}</div>`).join(''):'<p class="muted" style="font-size:12px">Aún no se envía a autorización.</p>'}</div></div></div>`;shell(content);wireCommon();$('#backRequests')?.addEventListener('click',()=>{route='requests';render()});$('#evaluateRequest')?.addEventListener('click',()=>evaluateRequest(r))}
function approvals(){const rows=state.approvals.filter(a=>admin()||a.approver===currentUser.key);const content=pageHead('Decisiones de Dirección','Centro de autorizaciones','Armando y Gabriel consultan el mismo portafolio y registran decisiones por separado.')+`<div class="card"><div class="card-head"><div><h2>Solicitudes por autorizar</h2><p>Las decisiones quedan asociadas al aprobador correspondiente</p></div></div><div class="table-wrap"><table><thead><tr><th>Folio</th><th>Proyecto solicitado</th><th>Aprobador</th><th>Decisión</th><th>Acción</th></tr></thead><tbody>${rows.map(a=>{const r=state.requests.find(x=>x.id===a.requestId);return `<tr><td>${e(a.requestId)}</td><td><strong>${e(r?.title||'—')}</strong></td><td>${e(USERS.find(u=>u.key===a.approver)?.name)}</td><td>${showStatus(a.decision)}</td><td>${a.decision==='Pendiente'&&currentUser.key===a.approver?`<button class="btn primary" data-decide="${e(a.id)}">Resolver</button>`:a.decision==='Pendiente'&&admin()?'<small>Decisión reservada al aprobador</small>':'<small>Registrada</small>'}</td></tr>`}).join('')}</tbody></table></div></div>`;shell(content);document.querySelectorAll('[data-decide]').forEach(b=>b.addEventListener('click',()=>openApproval(b.dataset.decide)))}
function activities(){const content=pageHead('Gestión BI','Actividades del portafolio','Seguimiento operativo de tareas, riesgos y entregables.')+`<div class="card"><div class="card-head"><h2>Actividades de proyectos</h2></div><div class="table-wrap"><table><thead><tr><th>Código</th><th>Actividad</th><th>Proyecto</th><th>Estado</th><th>Avance</th><th>Entrega</th><th></th></tr></thead><tbody>${state.activities.map(a=>`<tr><td>${e(a.id)}</td><td><strong>${e(a.name)}</strong></td><td>${e(state.projects.find(p=>p.id===a.projectId)?.name||a.projectId)}</td><td>${showStatus(a.status)}</td><td>${progress(a.progress)}</td><td>${e(a.dueDate)}</td><td><button class="section-link" data-edit-task="${e(a.id)}">Editar</button></td></tr>`).join('')}</tbody></table></div></div>`;shell(content);document.querySelectorAll('[data-edit-task]').forEach(b=>b.addEventListener('click',()=>openTaskForm(state.activities.find(a=>a.id===b.dataset.editTask).projectId,state.activities.find(a=>a.id===b.dataset.editTask))))}
function newRequest(){const content=pageHead('Nuevo requerimiento','Solicitar un proyecto BI','Tus datos se toman automáticamente del correo con el que ingresaste.')+`<div class="card" style="max-width:960px"><div class="card-head"><h2>Datos de la solicitud</h2><span class="pill">MODO DEMO</span></div><div class="card-body"><form id="reqForm" class="form-grid"><div class="field"><label for="requestName">Nombre del proyecto *</label><input id="requestName" name="title" required maxlength="130" class="input" placeholder="Ej. Dashboard de productividad"></div><div class="field"><label for="requestArea">Área solicitante *</label><select class="select" name="area" id="requestArea" required><option value="">Selecciona un área</option>${['Finanzas','Operaciones','Recursos Humanos','Nóminas','Marketing','Ventas','Calidad','Dirección','TI','Otra'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Solicitante</label><input class="input" value="${e(currentUser.name)}" disabled><small>Identidad del entorno demo. En producción se obtendrá de Microsoft Entra ID.</small></div><div class="field"><label>Correo</label><input class="input" value="${e(currentUser.email)}" disabled></div><div class="field full"><label for="requestDesc">Necesidad actual *</label><textarea class="textarea" required id="requestDesc" name="description" maxlength="1500" placeholder="¿Qué proceso deseas mejorar?"></textarea></div><div class="field full"><label for="requestBenefit">Beneficio esperado *</label><textarea class="textarea" required id="requestBenefit" name="benefit" maxlength="1500" placeholder="Describe el resultado y su impacto."></textarea></div><div class="field"><label for="requestPriority">Urgencia *</label><select class="select" name="priority" id="requestPriority"><option>Media</option><option>Baja</option><option>Alta</option><option>Crítica</option></select></div><div class="field"><label for="requestDue">Fecha requerida</label><input type="date" class="input" name="due" id="requestDue"></div><div class="field full" style="flex-direction:row;justify-content:flex-end"><button type="reset" class="btn">Limpiar</button><button type="submit" class="btn primary">Registrar solicitud →</button></div></form></div></div>`;shell(content);$('#reqForm')?.addEventListener('submit',ev=>{ev.preventDefault();const f=new FormData(ev.currentTarget);const n=Math.max(0,...state.requests.map(r=>Number((r.id.match(/(\d+)$/)||[])[1])||0))+1;const id='SOL-2026-'+String(n).padStart(3,'0');state.requests.push({id,title:String(f.get('title')).trim(),area:String(f.get('area')),owner:currentUser.name,email:currentUser.email,priority:String(f.get('priority')),status:'Nueva',date:dateISO(),description:String(f.get('description')).trim(),benefit:String(f.get('benefit')).trim()});save();route='requests';render();notify(`Solicitud ${id} registrada en la demo`)})}
function evaluateRequest(r){modal(`<h2>Evaluación de solicitud</h2><p>${e(r.title)} · ${e(r.id)}</p><form id="evalForm"><div class="field"><label>Estado de la solicitud</label><select class="select" name="status" style="width:100%">${['Nueva','Pendiente de evaluación BI','En evaluación BI','Pendiente de información','Lista para autorización','En autorización','Aprobada','Rechazada'].map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field" style="margin-top:15px"><label>Comentario interno</label><textarea class="textarea" name="comment" style="width:100%" placeholder="Motivo de cambio y próximos pasos"></textarea></div><div class="modal-footer"><button type="button" class="btn" id="closeModal">Cancelar</button><button type="submit" class="btn primary">Guardar evaluación</button></div></form>`);$('#closeModal').addEventListener('click',closeModal);$('#evalForm').addEventListener('submit',ev=>{ev.preventDefault();const f=new FormData(ev.currentTarget);const old=r.status;r.status=String(f.get('status'));state.history.push({item:r.id,actor:currentUser.name,action:'Evaluación',from:old,to:r.status,comment:String(f.get('comment'))});if(r.status==='En autorización'||r.status==='Lista para autorización'){for(const key of ['armando','gabriel'])if(!state.approvals.some(a=>a.requestId===r.id&&a.approver===key))state.approvals.push({id:'APR-'+Math.random().toString(36).slice(2,9),requestId:r.id,approver:key,decision:'Pendiente',comment:''})}save();closeModal();requestDetail(r.id);notify('Evaluación guardada en la demo')})}
function openApproval(id){const a=state.approvals.find(x=>x.id===id);if(!a||a.approver!==currentUser.key||a.decision!=='Pendiente')return;const r=state.requests.find(x=>x.id===a.requestId);modal(`<h2>Resolver autorización</h2><p>${e(r?.title)} · ${e(a.requestId)}</p><div class="alert blue" style="margin:16px 0">Esta decisión se registrará únicamente para el perfil de ${e(currentUser.name)}.</div><form id="approvalForm"><div class="field"><label>Decisión</label><select class="select" name="decision" style="width:100%"><option value="Aprobada">Aprobar</option><option value="Aprobada con condiciones">Aprobar con condiciones</option><option value="Solicitar información">Solicitar información</option><option value="Rechazada">Rechazar</option></select></div><div class="field" style="margin-top:14px"><label>Comentarios</label><textarea class="textarea" name="comment" style="width:100%" placeholder="Comentarios de dirección"></textarea></div><div class="modal-footer"><button type="button" class="btn" id="closeModal">Cancelar</button><button type="submit" class="btn primary">Registrar decisión</button></div></form>`);$('#closeModal').addEventListener('click',closeModal);$('#approvalForm').addEventListener('submit',ev=>{ev.preventDefault();const f=new FormData(ev.currentTarget);a.decision=String(f.get('decision'));a.comment=String(f.get('comment'));state.history.push({item:a.requestId,actor:currentUser.name,action:'Autorización',from:'Pendiente',to:a.decision,comment:a.comment});const pair=state.approvals.filter(x=>x.requestId===a.requestId);if(pair.every(x=>x.decision!=='Pendiente')){r.status=pair.some(x=>x.decision==='Rechazada')?'Rechazada':pair.every(x=>x.decision.startsWith('Aprobada'))?'Aprobada':'Pendiente de información'}save();closeModal();approvals();notify('Decisión registrada de forma independiente')})}
function openProjectForm(p){if(!admin())return;const editing=!!p;const data=p||{name:'',area:'',owner:'Inteligencia de Negocios',sponsor:'Dirección',status:'Backlog',priority:'Media',health:'Verde',progress:0,startDate:dateISO(),dueDate:'2026-12-05',nextMilestone:'',milestoneDate:'2026-11-20',blocker:''};modal(`<h2>${editing?'Editar proyecto':'Registrar proyecto'}</h2><p>Los cambios afectarán únicamente los datos de esta demostración.</p><form id="projectForm"><div class="form-grid"><div class="field full"><label>Nombre del proyecto *</label><input class="input" name="name" required maxlength="150" value="${e(data.name)}"></div><div class="field"><label>Área</label><input class="input" name="area" required value="${e(data.area)}"></div><div class="field full"><label>Solicitud de origen (opcional)</label><select class="select" name="sourceRequest"><option value="">Proyecto interno / sin solicitud</option>${state.requests.filter(r=>r.status==='Aprobada'||r.projectId===data.id).map(r=>`<option value="${e(r.id)}" ${r.projectId===data.id?'selected':''}>${e(r.id)} · ${e(r.title)} · ${e(r.owner)}</option>`).join('')}</select><small>Vincula el proyecto al solicitante para que pueda consultar su estatus.</small></div><div class="field"><label>Responsable</label><input class="input" name="owner" value="${e(data.owner)}"></div><div class="field"><label>Estado</label><select class="select" name="status">${['Backlog','Programado','En análisis','En desarrollo','Bloqueado','En pruebas','Publicado','Cerrado','Cancelado'].map(x=>`<option ${x===data.status?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Prioridad</label><select class="select" name="priority">${['Baja','Media','Alta','Crítica'].map(x=>`<option ${x===data.priority?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Avance (%)</label><input class="input" name="progress" type="number" min="0" max="100" value="${data.progress}"></div><div class="field"><label>Fecha compromiso</label><input class="input" name="dueDate" type="date" required value="${e(data.dueDate)}"></div><div class="field full"><label>Próximo hito</label><input class="input" name="nextMilestone" value="${e(data.nextMilestone)}"></div><div class="field full"><label>Bloqueo actual</label><textarea class="textarea" name="blocker">${e(data.blocker)}</textarea></div></div><div class="modal-footer"><button type="button" class="btn" id="closeModal">Cancelar</button><button class="btn primary" type="submit">${editing?'Guardar cambios':'Crear proyecto'}</button></div></form>`);$('#closeModal').addEventListener('click',closeModal);$('#projectForm').addEventListener('submit',ev=>{ev.preventDefault();const f=new FormData(ev.currentTarget);const upd={name:String(f.get('name')).trim(),area:String(f.get('area')).trim(),owner:String(f.get('owner')).trim(),status:String(f.get('status')),priority:String(f.get('priority')),progress:Math.max(0,Math.min(100,Number(f.get('progress'))||0)),dueDate:String(f.get('dueDate')),nextMilestone:String(f.get('nextMilestone')),blocker:String(f.get('blocker'))};const source=state.requests.find(r=>r.id===String(f.get('sourceRequest')||''));if(editing){Object.assign(p,upd);if(source)source.projectId=p.id;state.history.push({item:p.id,actor:currentUser.name,action:'Edición',to:upd.status})}else{const n=Math.max(0,...state.projects.map(p=>Number((p.id.match(/(\d+)$/)||[])[1])||0))+1;const id='PRY-'+String(n).padStart(3,'0');state.projects.push({...data,...upd,id});if(source)source.projectId=id}save();closeModal();selectedProject=editing?p.id:state.projects.at(-1).id;route='detail';render();notify(editing?'Proyecto actualizado':'Proyecto creado en la demo')})}
function openTaskForm(projectId,a){if(!admin())return;const data=a||{name:'',phase:'Desarrollo',owner:'BI',status:'No iniciada',progress:0,dueDate:'2026-11-20'};modal(`<h2>${a?'Editar actividad':'Nueva actividad'}</h2><p>${e(state.projects.find(p=>p.id===projectId)?.name)}</p><form id="taskForm"><div class="field"><label>Nombre *</label><input name="name" required maxlength="150" class="input" value="${e(data.name)}"></div><div class="form-grid" style="margin-top:14px"><div class="field"><label>Estado</label><select class="select" name="status">${['No iniciada','En proceso','Bloqueada','En validación','Completada','Cancelada'].map(x=>`<option ${data.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Avance (%)</label><input name="progress" class="input" type="number" min="0" max="100" value="${data.progress}"></div><div class="field"><label>Fase</label><input name="phase" class="input" value="${e(data.phase)}"></div><div class="field"><label>Fecha de entrega</label><input name="dueDate" class="input" type="date" value="${e(data.dueDate)}"></div></div><div class="modal-footer"><button type="button" id="closeModal" class="btn">Cancelar</button><button class="btn primary" type="submit">Guardar actividad</button></div></form>`);$('#closeModal').addEventListener('click',closeModal);$('#taskForm').addEventListener('submit',ev=>{ev.preventDefault();const f=new FormData(ev.currentTarget);const upd={name:String(f.get('name')).trim(),status:String(f.get('status')),progress:Math.max(0,Math.min(100,Number(f.get('progress'))||0)),phase:String(f.get('phase')),dueDate:String(f.get('dueDate'))};if(a)Object.assign(a,upd);else{const n=Math.max(0,...state.activities.map(x=>Number((x.id.match(/(\d+)$/)||[])[1])||0))+1;state.activities.push({id:'ACT-'+String(n).padStart(3,'0'),projectId,owner:'BI',...upd})}if(String(projectId).startsWith('PBI-')){
 const proj=state.projects.find(p=>p.id===projectId),t=state.activities.filter(x=>x.projectId===projectId);
 if(proj && t.length){proj.progress=Math.round(100*t.filter(x=>x.status==='Completada').length/t.length);proj.totalActivities=t.length;proj.completedActivities=t.filter(x=>x.status==='Completada').length;}
}state.history.push({item:a?.id||projectId,actor:currentUser.name,action:'Actividad actualizada',to:upd.status});save();closeModal();selectedProject=projectId;route='detail';render();notify('Actividad guardada en la demo')})}

function userAdmin(){
 if(!admin()){route=homeFor(currentUser);render();return}
 const users=state.users;
 const content=pageHead('CONTROL DE ACCESO','Administración de usuarios','Catálogo de usuarios, roles y habilitación para el portal.',`<button class="btn primary" id="createUser">＋ Agregar usuario</button>`)+
 `<div class="metrics">${metric('Usuarios registrados',users.length,'Directorio de Solicitud de Proyectos','♙')}${metric('Administradores',users.filter(x=>x.role==='admin_bi'&&x.active!==false).length,'Administración del sistema','⚙')}${metric('Jefes / Dirección',users.filter(x=>x.role==='jefe'&&x.active!==false).length,'Dashboard ejecutivo compartido','◇')}${metric('Solicitantes',users.filter(x=>x.role==='solicitante'&&x.active!==false).length,'Solicitudes y seguimiento','▧')}</div>`+
 `<div class="card"><div class="card-head"><div><h2>Directorio y permisos</h2><p>El rol se asigna aquí; el usuario no lo selecciona al ingresar.</p></div><span class="pill">SIMULACIÓN LOCAL</span></div><div class="table-wrap"><table><thead><tr><th>Usuario</th><th>Correo corporativo</th><th>Rol</th><th>Acceso</th><th>Acción</th></tr></thead><tbody>${users.map(u=>`<tr><td><strong>${e(u.name)}</strong><br><span class="muted">${e(u.subtitle||'')}</span></td><td>${e(u.email)}</td><td>${showStatus(u.role==='admin_bi'?'Administrador':u.role==='jefe'?'Jefe':'Solicitante')}</td><td>${showStatus(u.active===false?'Deshabilitado':'Activo')}</td><td><button class="btn" data-edit-user="${e(u.key)}">Editar permisos</button></td></tr>`).join('')}</tbody></table></div></div>`+
 `<div class="alert blue" style="margin-top:17px"><span>ℹ</span><span><strong>Diseño de seguridad:</strong> En producción, Entra ID validará la identidad y Fabric asignará permisos desde el backend. Los permisos de esta demo sólo afectan la interfaz local.</span></div>`;
 shell(content);
 $('#createUser')?.addEventListener('click',()=>openUserForm(null));
 document.querySelectorAll('[data-edit-user]').forEach(b=>b.addEventListener('click',()=>openUserForm(state.users.find(u=>u.key===b.dataset.editUser))));
}
function openUserForm(user){if(!admin())return;
 const editing=!!user;
 modal(`<h2>${editing?'Editar usuario':'Registrar usuario'}</h2><p>Los roles controlan el panel de inicio y las acciones permitidas.</p><form id="userForm">
 <div class="field" style="margin-top:18px"><label>Nombre completo *</label><input class="input" name="name" value="${e(user?.name||'')}" required maxlength="100" style="width:100%"></div>
 <div class="field" style="margin-top:14px"><label>Correo corporativo *</label><input class="input" type="email" name="email" value="${e(user?.email||'')}" ${editing?'readonly':''} required style="width:100%"></div>
 <div class="field" style="margin-top:14px"><label>Rol de acceso</label><select class="select" name="role" style="width:100%"><option value="solicitante" ${user?.role==='solicitante'?'selected':''}>Solicitante · Solicitudes y seguimiento</option><option value="jefe" ${user?.role==='jefe'?'selected':''}>Jefe · Dashboard y autorizaciones</option><option value="admin_bi" ${user?.role==='admin_bi'?'selected':''}>Administrador · Gestión completa</option></select></div>
 <label class="user-active"><input type="checkbox" name="active" ${user?.active!==false?'checked':''}> Usuario habilitado</label>
 <div class="modal-footer"><button type="button" class="btn" id="closeUser">Cancelar</button><button type="submit" class="btn primary">Guardar usuario</button></div></form>`);
 $('#closeUser').addEventListener('click',closeModal);
 $('#userForm').addEventListener('submit',ev=>{
  ev.preventDefault();const f=new FormData(ev.currentTarget);const email=normalizedEmail(f.get('email'));const name=String(f.get('name')||'').trim();const role=String(f.get('role'));const active=f.get('active')==='on';
  if(!name||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)||!['admin_bi','jefe','solicitante'].includes(role)){notify('Revisa el nombre, correo y rol');return}
  if(!editing&&state.users.some(x=>normalizedEmail(x.email)===email)){notify('Ese correo ya está registrado');return}
  if(editing&&user.key===currentUser.key&&(role!=='admin_bi'||!active)){notify('No puedes deshabilitar tu propia cuenta de administrador');return}
  const record=editing?user:{key:'usr'+Math.random().toString(36).slice(2,10),email};
  Object.assign(record,{email,name,role,active,initial:name.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase(),subtitle:role==='admin_bi'?'Administrador BI':role==='jefe'?'Jefatura / Dirección':'Solicitante'});
  if(!editing)state.users.push(record);
  USERS=state.users;state.history.push({item:email,actor:currentUser.name,action:editing?'Usuario modificado':'Usuario registrado',to:role});save();closeModal();userAdmin();notify(editing?'Permisos actualizados':'Usuario registrado en el entorno demo');
 });
}
function myProjects(){
 if(allowed()){route='projects';render();return}
 const email=normalizedEmail(currentUser.email);
 const ownRequests=state.requests.filter(r=>normalizedEmail(r.email)===email);
 const ownProjects=state.projects.filter(p=>ownRequests.some(r=>r.projectId===p.id));
 const content=pageHead('MI ESPACIO','Seguimiento de mis proyectos','Consulta el estado y los compromisos vinculados a tus solicitudes.',`<button class="btn primary" data-nav="new">＋ Nueva solicitud</button>`)+
 `<div class="metrics">${metric('Solicitudes enviadas',ownRequests.length,'Presentadas por tu usuario','▧')}${metric('Proyectos asignados',ownProjects.length,'Vinculados a tus solicitudes','▤')}${metric('En proceso',ownProjects.filter(p=>!finalStatuses.includes(p.status)).length,'Proyectos activos','↗')}${metric('Terminados',ownProjects.filter(p=>finalStatuses.includes(p.status)).length,'Publicados o cerrados','✓')}</div>`+
 `<div class="card"><div class="card-head"><h2>Mis proyectos</h2></div>${ownProjects.length?`<div class="table-wrap"><table><thead><tr><th>Proyecto</th><th>Estado</th><th>Avance</th><th>Entrega estimada</th><th>Próximo hito</th></tr></thead><tbody>${ownProjects.map(p=>`<tr><td><strong>${e(p.name)}</strong></td><td>${showStatus(p.status)}</td><td>${progress(p.progress)}</td><td>${e(p.dueDate||'—')}</td><td>${e(p.nextMilestone||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Tus solicitudes todavía no tienen proyectos vinculados. Puedes consultar sus folios en Mis solicitudes.</div>'}</div>`;
 shell(content);
}

function wireCommon(){document.querySelectorAll('[data-project]').forEach(el=>el.addEventListener('click',()=>{selectedProject=el.dataset.project;route='detail';render()}));document.querySelectorAll('[data-request]').forEach(el=>el.addEventListener('click',()=>{selectedProject=el.dataset.request;route='request-detail';render()}));document.querySelectorAll('[data-action="export"]').forEach(el=>el.addEventListener('click',()=>{const rows=[['Proyecto','Área','Estado','Prioridad','Avance','Fecha compromiso'],...state.projects.map(p=>[p.name,p.area,p.status,p.priority,p.progress,p.dueDate])];const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Solicitud de Proyectos_demo_portafolio.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);notify('Resumen de demostración exportado') }));}
function render(){if(!currentUser){loginScreen();return}if(!allowed()&&!['requests','new','request-detail','my-projects'].includes(route)){route=homeFor(currentUser)}if(route==='dashboard')dashboard();else if(route==='projects')projects();else if(route==='detail')detail(selectedProject);else if(route==='requests')requests();else if(route==='request-detail')requestDetail(selectedProject);else if(route==='approvals')approvals();else if(route==='activities'&&admin())activities();else if(route==='users'&&admin())userAdmin();else if(route==='my-projects')myProjects();else if(route==='new')newRequest();else dashboard()}
window.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&dialog)closeModal()});render();
</script></body></html>
